version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 320527136778.dkr.ecr.ap-south-1.amazonaws.com

  build:
    commands:
      - echo Building Docker image...
      - docker build -t brain-task-app .
      - docker tag brain-task-app:latest 320527136778.dkr.ecr.ap-south-1.amazonaws.com/brain-task-app-ecr-repo:v1

  post_build:
    commands:
      - echo Pushing Docker image to ECR...
      - docker push 320527136778.dkr.ecr.ap-south-1.amazonaws.com/brain-task-app-ecr-repo:v1
      - echo Deploying to EKS...
      - aws eks update-kubeconfig --region ap-south-1 --name brain-task-cluster
      - kubectl apply -f deployment.yaml
      - kubectl apply -f service.yaml
      - kubectl rollout status deployment/brain-task-deployment
